name: Build EliteStocks TV Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EliteStocksTV-Android-Player/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EliteStocksTV-Android-Player

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java / JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EliteStocksTV-Android-Player/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            EliteStocksTV-Android-Player/src-tauri -> EliteStocksTV-Android-Player/src-tauri/target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android
        run: |
          npx tauri android init

      - name: Enable HTTP IPTV providers
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          npx tauri android build --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocksTV-Android-${{ github.sha }}
          path: |
            EliteStocksTV-Android-Player/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14