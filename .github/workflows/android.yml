name: Build Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EliteStocksTV-Android-Player

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EliteStocksTV-Android-Player/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android
        run: npm run android:init

      - name: Build Debug APK
        run: npm run android:build -- --debug

      - name: Find APK
        run: |
          echo "APK files:"
          find src-tauri/gen/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EliteStocksTV-Debug-APK
          path: EliteStocksTV-Android-Player/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
