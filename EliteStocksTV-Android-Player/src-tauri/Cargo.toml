[package]
name = "elitestocks-tv"
version = "1.0.0"
description = "EliteStocks TV Android IPTV player"
authors = ["EliteStocks TV"]
edition = "2021"

[lib]
name = "elitestocks_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = "2.5.9"
tauri-plugin-video = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
